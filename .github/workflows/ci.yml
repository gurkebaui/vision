name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Headless OpenCV: CI runners have no display server.
          pip install opencv-python-headless
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        # No camera and no model bundle on the runner; the suite is built to
        # run entirely on synthetic hands.
        run: pytest -q --cov=gesturekit --cov-report=term-missing

      - name: Smoke-test the CLI
        run: |
          gesturekit --version
          gesturekit profiles
          gesturekit bindings -p presentation
          gesturekit bindings -p desktop
